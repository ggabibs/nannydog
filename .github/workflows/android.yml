name: 📱 Gerar APK Android

# Compila o app Android (Capacitor) automaticamente.
# O APK pronto fica em: Actions → esta execução → Artifacts → "NannyDog-APK"
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK (debug, instalável)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Capacitor 8 exige Node >= 22
          cache: npm

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 compila com source release 21

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Montar o site (pasta www)
        run: npm run build:www

      - name: Sincronizar com o Android (Capacitor)
        shell: bash
        run: |
          npx cap --version
          npx cap sync android 2>&1 | tee cap-sync.log

      - name: Mostrar log do Capacitor no resumo (se falhar)
        if: failure()
        run: |
          { echo '### Log do cap sync'; echo '```'; cat cap-sync.log 2>/dev/null || echo '(sem log)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar o APK
        working-directory: android
        shell: bash
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: Publicar o fim do log do Gradle (se falhar)
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('gradle.log')
          raw = p.read_text(errors='replace').splitlines() if p.exists() else ['(sem log)']
          clean = [l for l in raw if not l.lstrip().startswith('at ')]
          start = next((i for i, l in enumerate(clean) if 'FAILURE' in l or 'What went wrong' in l), max(0, len(clean) - 60))
          lines = clean[start:start + 70]
          msg = '\n'.join(lines).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::error title=Erro do Gradle::{msg}")
          PY

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NannyDog.apk

      - name: Publicar o APK como artefato baixável
        uses: actions/upload-artifact@v4
        with:
          name: NannyDog-APK
          path: NannyDog.apk
          if-no-files-found: error
          retention-days: 90
